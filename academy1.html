<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;background:#F0F4FF;min-height:100vh;font-size:15px}
#app{max-width:500px;margin:0 auto;min-height:100vh}
button,input,select,textarea{font-family:inherit}
.hdr{background:linear-gradient(135deg,#1E1B4B,#4338CA,#6D28D9);padding:14px 16px;position:sticky;top:0;z-index:50;color:#fff;box-shadow:0 4px 16px rgba(67,56,202,.3)}
.main{padding:14px 14px 90px}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.bp{background:linear-gradient(135deg,#6366F1,#8B5CF6);color:#fff;border:none;border-radius:12px;padding:12px 20px;font-weight:700;font-size:15px;cursor:pointer;width:100%}
.bp:disabled{opacity:.5;cursor:not-allowed}
.bs{background:#F3F4F6;color:#374151;border:none;border-radius:10px;padding:9px 16px;font-weight:600;font-size:14px;cursor:pointer}
.bd{background:#FEE2E2;color:#DC2626;border:none;border-radius:8px;padding:5px 12px;font-weight:700;font-size:13px;cursor:pointer}
.bg-btn{background:#FEF3C7;color:#92400E;border:none;border-radius:8px;padding:5px 12px;font-weight:700;font-size:13px;cursor:pointer}
.fi{width:100%;padding:11px 14px;border-radius:11px;border:2px solid #E5E7EB;font-size:14px;outline:none;background:#fff;transition:border-color .2s}
.fi:focus{border-color:#6366F1}
.tabs{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap}
.tab{flex:1;min-width:60px;padding:9px 6px;border-radius:11px;border:2px solid #E5E7EB;background:#fff;color:#6B7280;font-weight:600;font-size:12px;cursor:pointer;white-space:nowrap}
.tab.on{border-color:transparent;background:#6366F1;color:#fff;font-weight:800}
.tab.quit-tab{border-color:#FCD34D;color:#92400E;background:#FFFBEB}
.tab.quit-tab.on{background:linear-gradient(135deg,#F59E0B,#D97706);border-color:transparent;color:#fff}
.dtabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;scrollbar-width:none}
.dtabs::-webkit-scrollbar{display:none}
.dtab{flex-shrink:0;padding:7px 11px;border-radius:11px;border:2px solid #E5E7EB;background:#fff;cursor:pointer;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:44px;color:#6B7280;font-weight:500}
.sc{width:100%;background:#fff;border-radius:14px;padding:13px;border:1.5px solid #E5E7EB;cursor:pointer;display:flex;align-items:center;gap:11px;margin-bottom:8px;text-align:left;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.sc:active{transform:scale(.98)}
.nc{background:#fff;border-radius:12px;padding:13px;margin-bottom:8px;border:1.5px solid #E5E7EB}
.ap{background:#fff;border-radius:14px;border:2px solid #FED7AA;margin-bottom:12px;overflow:hidden}
.ap-hd{padding:11px 14px;background:linear-gradient(135deg,#FFF7ED,#FFEDD5);border-bottom:1px solid #FED7AA;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ap-row{width:100%;display:flex;align-items:center;gap:10px;padding:11px 14px;background:#fff;border:none;border-top:1px solid #FEF3C7;cursor:pointer;text-align:left}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:flex-end;justify-content:center;z-index:200;backdrop-filter:blur(4px)}
.modal-c{background:#fff;border-radius:22px 22px 0 0;width:100%;max-width:500px;padding:20px 16px 44px;max-height:90vh;overflow-y:auto}
.pbar{height:8px;background:#E5E7EB;border-radius:4px;overflow:hidden}
.pfill{height:100%;border-radius:4px;transition:width .5s ease}
.ring-wrap{display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0}
.toast{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;border-radius:14px;padding:12px 18px;display:flex;gap:9px;align-items:center;max-width:400px;width:calc(100% - 20px);z-index:300;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:toastIn .3s ease}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.lbl{display:block;font-size:12px;font-weight:600;color:#6B7280;margin-bottom:5px}
.empty{text-align:center;color:#9CA3AF;padding:44px 0;background:#fff;border-radius:14px;border:2px dashed #E5E7EB}
.login-bg{min-height:100vh;background:linear-gradient(135deg,#0F0A2E,#1E1B4B,#4338CA,#6D28D9);display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:#fff;border-radius:22px;padding:32px 24px;width:100%;max-width:380px;box-shadow:0 24px 64px rgba(0,0,0,.35)}
.back-btn{display:inline-flex;align-items:center;gap:5px;background:none;border:none;color:#6366F1;font-weight:700;cursor:pointer;font-size:14px;padding:0;margin-bottom:14px}
.nta{width:100%;min-height:72px;border-radius:10px;border:2px solid #6366F1;padding:9px 12px;font-size:13px;resize:vertical;outline:none;line-height:1.5}
.ibanner{background:linear-gradient(135deg,#ECFDF5,#D1FAE5);border:2px solid #34D399;border-radius:12px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.hstat{flex:1;background:rgba(255,255,255,.13);border-radius:10px;padding:7px;text-align:center}
.errmsg{background:#FEF2F2;color:#DC2626;border-radius:9px;padding:10px 13px;font-size:13px;margin-top:8px;border:1px solid #FECACA}
.sec-ttl{font-size:14px;font-weight:700;color:#374151;margin-bottom:9px}
.loading{text-align:center;padding:32px;color:#9CA3AF;font-size:13px}
/* 다운로드 버튼 */
.dl-btn{background:linear-gradient(135deg,#059669,#10B981);color:#fff;border:none;border-radius:10px;padding:9px 14px;font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:5px}
.dl-panel{background:#fff;border-radius:14px;border:2px solid #D1FAE5;margin-bottom:12px;overflow:hidden}
.dl-panel-hd{padding:11px 14px;background:linear-gradient(135deg,#ECFDF5,#D1FAE5);border-bottom:1px solid #D1FAE5;display:flex;align-items:center;gap:7px}
/* 그만둔 학생 */
.quit-card{background:#FFFBEB;border-radius:14px;padding:13px;border:1.5px solid #FCD34D;cursor:pointer;display:flex;align-items:center;gap:11px;margin-bottom:8px;text-align:left;box-shadow:0 2px 8px rgba(0,0,0,.04);opacity:.85}
.restore-btn{background:#EEF2FF;color:#4338CA;border:none;border-radius:8px;padding:5px 12px;font-weight:700;font-size:13px;cursor:pointer}
/* 회차 추가 모달 */
.lesson-modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:250;backdrop-filter:blur(4px);padding:20px}
.lesson-modal-c{background:#fff;border-radius:22px;width:100%;max-width:400px;padding:24px 20px}
</style>

<div id="app"><div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-size:36px">⏳</div></div>
<div id="SRCH_BOX" style="display:none;max-width:500px;margin:0 auto;padding:0 14px 12px">
  <div style="display:flex;gap:8px;margin-bottom:12px">
    <div style="flex:1;position:relative">
      <span style="position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:17px;pointer-events:none">🔍</span>

    </div>
    <button onclick="doSearch()" style="background:linear-gradient(135deg,#6366F1,#8B5CF6);color:#fff;border:none;border-radius:12px;padding:0 16px;font-weight:700;font-size:14px;cursor:pointer;flex-shrink:0">검색</button>
  </div>
  <div id="SRCH_RES"></div>
</div>

<script>
/* ══ Firebase 설정 ══ */
var FB1={apiKey:"AIzaSyDCNm3RzgKOsVsG864yopYaY9jnOycDVIc",authDomain:"project-402538a5-a8b1-40a1-a97.firebaseapp.com",databaseURL:"https://project-402538a5-a8b1-40a1-a97-default-rtdb.firebaseio.com",projectId:"project-402538a5-a8b1-40a1-a97",storageBucket:"project-402538a5-a8b1-40a1-a97.firebasestorage.app",messagingSenderId:"414728841659",appId:"1:414728841659:web:0d883c5ce39b0ab679fc9e"};
var ADMIN_EMAIL="noella7154@gmail.com";
var ACAD_NAME="생각키움연구소";

var DAYS=['월','화','수','목','금','토','일'];
var DC={'월':{bg:'#EEF2FF',tx:'#4338CA',bd:'#818CF8'},'화':{bg:'#FFF7ED',tx:'#C2410C',bd:'#FB923C'},'수':{bg:'#F0FDF4',tx:'#15803D',bd:'#4ADE80'},'목':{bg:'#FDF4FF',tx:'#7E22CE',bd:'#C084FC'},'금':{bg:'#FFF1F2',tx:'#BE123C',bd:'#FB7185'},'토':{bg:'#F0F9FF',tx:'#0369A1',bd:'#38BDF8'},'일':{bg:'#FEF9C3',tx:'#854D0E',bd:'#FACC15'}};
var TIMES=['09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00','20:00','21:00'];

/* ══ 앱 상태 ══ */
var G={user:null,admin:false,
  stuData:{},
  quitData:{},   /* 그만둔 학생 */
  curNotes:{},
  view:'sch',prevView:'sch',selDay:'월',sid:null,
  notif:null,form:false,esid:null,fdays:['월'],enid:null,
  showAddLesson:false,  /* 회차 추가 모달 */
  addLessonSid:null,
  showQuit:false};  /* 그만둔 학생 보기 여부 */
var _saving=false,_ime=false,_pend=false,_noteListener=null;

/* ══ 초성 검색 ══ */
var CSARR='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
function toCS(s){var r='',i,c;for(i=0;i<s.length;i++){c=s.charCodeAt(i);r+=(c>=0xAC00&&c<=0xD7A3)?CSARR[Math.floor((c-0xAC00)/588)]:s[i];}return r;}
function isCS(s){var i,c;if(!s)return false;for(i=0;i<s.length;i++){c=s.charCodeAt(i);if(!(c>=0x3131&&c<=0x314E))return false;}return s.length>0;}

/* ══ 유틸 ══ */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function xe(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function rem(s){return Math.max(0,(+s.totalLessons||0)-(+s.usedLessons||0))}
function rc(r){return r<=0?'#EF4444':r===1?'#F97316':r<=3?'#F59E0B':'#10B981'}

function objArr(obj){
  var r=[],keys,i,k,s,copy,p;
  if(!obj)return r;
  keys=Object.keys(obj);
  for(i=0;i<keys.length;i++){
    k=keys[i];s=obj[k];copy={};
    for(p in s){if(Object.prototype.hasOwnProperty.call(s,p))copy[p]=s[p];}
    copy.id=copy.id||k;copy.totalLessons=+copy.totalLessons||0;copy.usedLessons=+copy.usedLessons||0;
    r.push(copy);
  }
  return r;
}
function noteArr(obj){
  var r=[],keys,i,k,n,copy,p;
  if(!obj)return r;
  keys=Object.keys(obj);
  for(i=0;i<keys.length;i++){
    k=keys[i];n=obj[k];copy={};
    for(p in n){if(Object.prototype.hasOwnProperty.call(n,p))copy[p]=n[p];}
    copy.id=copy.id||k;r.push(copy);
  }
  return r.sort(function(a,b){return(+a.lessonNum||0)-(+b.lessonNum||0);});
}
function allStu(){return objArr(G.stuData);}
function allQuit(){return objArr(G.quitData);}
function stuById(id){
  var s=G.stuData[id]||G.quitData[id];
  if(!s)return null;
  var c={},p;for(p in s){if(Object.prototype.hasOwnProperty.call(s,p))c[p]=s[p];}
  c.id=c.id||id;c.totalLessons=+c.totalLessons||0;c.usedLessons=+c.usedLessons||0;return c;
}

/* ══ Firebase ══ */
firebase.initializeApp(FB1);
var auth=firebase.auth(),db=firebase.database();

document.addEventListener('compositionstart',function(){_ime=true;});
document.addEventListener('compositionend',function(){_ime=false;if(_pend){_pend=false;R();}});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.id==='SRCH_INPUT'){e.preventDefault();doSearch();}
  if(e.key==='Enter'&&e.target.id==='PW_IN')doLogin();
});

/* ══ 리스너: 재학생 ══ */
function startListen(){
  db.ref('students').on('value',function(snap){
    var data=snap.val()||{},keys,i,k,s,basic,p;
    G.stuData={};
    keys=Object.keys(data);
    for(i=0;i<keys.length;i++){
      k=keys[i];s=data[k];basic={};
      for(p in s){if(Object.prototype.hasOwnProperty.call(s,p)&&p!=='notes')basic[p]=s[p];}
      basic.id=basic.id||k;
      basic.totalLessons=+basic.totalLessons||0;
      basic.usedLessons=+basic.usedLessons||0;
      if(G.admin&&rem(basic)<=0&&!basic.notified){
        showToast(basic.name+' 학생의 수업이 모두 완료되었습니다!');
        db.ref('students/'+k+'/notified').set(true);
      }
      G.stuData[k]=basic;
    }
    safeR();
  });
  /* 그만둔 학생 리스너 */
  db.ref('quit_students').on('value',function(snap){
    var data=snap.val()||{},keys,i,k,s,basic,p;
    G.quitData={};
    keys=Object.keys(data);
    for(i=0;i<keys.length;i++){
      k=keys[i];s=data[k];basic={};
      for(p in s){if(Object.prototype.hasOwnProperty.call(s,p)&&p!=='notes')basic[p]=s[p];}
      basic.id=basic.id||k;
      basic.totalLessons=+basic.totalLessons||0;
      basic.usedLessons=+basic.usedLessons||0;
      G.quitData[k]=basic;
    }
    safeR();
  });
}

/* ══ 노트 리스너 ══ */
function loadNotes(sid){
  if(_noteListener){
    var prevRef=G.stuData[_noteListener]?'students':'quit_students';
    db.ref(prevRef+'/'+_noteListener+'/notes').off();
    _noteListener=null;
  }
  G.curNotes={};
  if(!sid)return;
  _noteListener=sid;
  var refPath=G.stuData[sid]?'students':'quit_students';
  db.ref(refPath+'/'+sid+'/notes').on('value',function(snap){
    G.curNotes=snap.val()||{};
    if(G.view==='det'&&G.sid===sid)R();
  });
}

function safeR(){
  var si=document.getElementById('SRCH_INPUT');
  if(_ime||(si&&document.activeElement===si)){_pend=true;return;}
  R();
}

/* ══ CRUD ══ */
function saveStu(){
  if(_saving)return;
  var ne=document.getElementById('F_NAME');
  if(!ne||!ne.value.trim()){alert('이름을 입력해 주세요.');return;}
  _saving=true;

  /* ★ 수정 시 기존 id 사용, 신규 시에만 새 uid 생성 */
  var id=G.esid||uid();
  var ex=G.stuData[id]||{};
  var obj={},p;
  for(p in ex){if(Object.prototype.hasOwnProperty.call(ex,p))obj[p]=ex[p];}
  obj.id=id;
  obj.name=ne.value.trim();
  obj.contact=(document.getElementById('F_CONTACT')||{}).value||'';
  obj.birthdate=(document.getElementById('F_BIRTH')||{}).value||'';
  /* ★ 다중 요일: days 배열 저장, day는 첫번째 요일(하위호환) */
  var selDays=G.fdays.length?G.fdays:['월'];
  obj.days=selDays.join(',');
  obj.day=selDays[0];
  obj.time=(document.getElementById('F_TIME')||{}).value||'15:00';
  obj.totalLessons=parseInt((document.getElementById('F_TOTAL')||{}).value)||10;
  obj.usedLessons=parseInt((document.getElementById('F_USED')||{}).value)||0;
  obj.level=(document.getElementById('F_LEVEL')||{}).value||'기타';
  obj.notified=ex.notified||false;
  obj.createdAt=ex.createdAt||new Date().toISOString();

  /* ★ update 사용 → 기존 데이터(노트 포함) 유지 */
  db.ref('students/'+id).update(obj)
    .then(function(){_saving=false;G.form=false;G.esid=null;showToast('✅ 저장되었습니다.');})
    .catch(function(){_saving=false;alert('저장 오류가 발생했습니다.');});
}

function delStu(id){
  if(!confirm('정말 삭제하시겠습니까?'))return;
  if(_noteListener===id){db.ref('students/'+id+'/notes').off();_noteListener=null;}
  db.ref('students/'+id).remove();
  G.sid=null;G.view=G.prevView||'sch';R();
}

/* ★ 수업 종료 후 회차 추가 모달 열기 */
function openAddLesson(sid){
  G.showAddLesson=true;
  G.addLessonSid=sid;
  R();
}
function closeAddLesson(){
  G.showAddLesson=false;
  G.addLessonSid=null;
  R();
}
/* ★ 실제 회차 추가 (횟수 리셋 후 추가) */
function doAddLesson(sid){
  var addEl=document.getElementById('ADD_LESSON_CNT');
  var add=parseInt(addEl?addEl.value:10)||10;
  if(add<1||add>200){alert('1~200 사이로 입력해 주세요.');return;}
  var s=stuById(sid);if(!s)return;
  /* 현재 진행한 횟수는 유지, 총 횟수만 늘림 */
  var newTotal=(+s.totalLessons||0)+add;
  db.ref('students/'+sid).update({totalLessons:newTotal,notified:false});
  G.showAddLesson=false;
  G.addLessonSid=null;
  showToast('✅ '+add+'회 추가되었습니다! (총 '+newTotal+'회)');
}

function addLesson(sid){
  var s=stuById(sid);if(!s)return;
  /* ★ 남은 수업 0이면 추가 모달로 */
  if(rem(s)<=0){openAddLesson(sid);return;}
  var nu=Math.min((+s.usedLessons||0)+1,+s.totalLessons||0);
  var nid=uid();
  var upd={usedLessons:nu};
  var nk='notes/'+nid;
  upd[nk]={id:nid,date:new Date().toLocaleDateString('ko-KR'),content:'',lessonNum:nu};
  db.ref('students/'+sid).update(upd);
  var r=Math.max(0,(+s.totalLessons||0)-nu);
  if(r===1)showToast('⚠️ '+s.name+' 학생 수업이 1회 남았습니다!');
  if(r===0)showToast('✅ '+s.name+' 학생 모든 수업 완료! 재등록을 안내하거나 수업을 추가하세요.');
}

function saveNote(sid,nid){
  var ta=document.getElementById('NOTE_TA');if(!ta)return;
  var refPath=G.stuData[sid]?'students':'quit_students';
  db.ref(refPath+'/'+sid+'/notes/'+nid+'/content').set(ta.value);
  G.enid=null;R();
}
function delNote(sid,nid){
  if(!confirm('수업 기록을 삭제하시겠습니까?'))return;
  var s=stuById(sid);
  var refPath=G.stuData[sid]?'students':'quit_students';
  db.ref(refPath+'/'+sid+'/notes/'+nid).remove();
  db.ref(refPath+'/'+sid+'/usedLessons').set(Math.max(0,(+s.usedLessons||1)-1));
}

/* ★ 그만둔 학생으로 이동 */
function moveToQuit(id){
  if(!confirm('이 학생을 "그만둔 학생"으로 이동하시겠습니까?\n수업 기록은 보존됩니다.'))return;
  var s=G.stuData[id];if(!s)return;
  /* 전체 데이터(노트 포함) 읽어서 quit_students로 복사 */
  db.ref('students/'+id).once('value',function(snap){
    var data=snap.val();if(!data)return;
    data.quitDate=new Date().toISOString();
    db.ref('quit_students/'+id).set(data).then(function(){
      db.ref('students/'+id).remove();

/* CSV 이스케이프 */
function csvEsc(v){
  var s=String(v||'');
  if(s.indexOf(',')>=0||s.indexOf('"')>=0||s.indexOf('\n')>=0){
    return '"'+s.replace(/"/g,'""')+'"';
  }
  return s;
}

/* BOM + CSV 다운로드 */
function downloadCSV(filename,csvStr){
  var bom='\uFEFF';
  var blob=new Blob([bom+csvStr],{type:'text/csv;charset=utf-8;'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},100);
}

/* ★ 학생 정보 다운로드 */
function downloadStudentInfo(){
  var ss=allStu();
  if(!ss.length){alert('다운로드할 학생 정보가 없습니다.');return;}
  ss.sort(function(a,b){return a.day.localeCompare(b.day)||a.time.localeCompare(b.time);});
  var rows=['이름,생년월일,연락처,수업요일,수업시간,총수업횟수,진행횟수,남은횟수,등록일'];
  var i,s;
  for(i=0;i<ss.length;i++){
    s=ss[i];
    rows.push([
      csvEsc(s.name),csvEsc(s.birthdate),csvEsc(s.contact),
      csvEsc(s.day),csvEsc(s.time),
      s.totalLessons,s.usedLessons,rem(s),
      csvEsc(s.createdAt?s.createdAt.slice(0,10):'')
    ].join(','));
  }
  var today=new Date().toLocaleDateString('ko-KR').replace(/\. /g,'-').replace('.','');
  downloadCSV('학생정보_'+today+'.csv',rows.join('\n'));
  showToast('📥 학생 정보 다운로드 완료!');
}

/* ★ 수업 메모 다운로드 (모든 학생 노트를 한 번에 읽어서 내보내기) */
function downloadAllNotes(){
  showToast('⏳ 수업 메모를 불러오는 중...');
  db.ref('students').once('value',function(snap){
    var data=snap.val()||{};
    var rows=['학생이름,회차,날짜,수업내용'];
    var keys=Object.keys(data),i,k,s,ns,nkeys,j,nk,n;
    var hasAny=false;
    for(i=0;i<keys.length;i++){
      k=keys[i];s=data[k];
      if(!s||!s.notes)continue;
      ns=s.notes;nkeys=Object.keys(ns);
      nkeys.sort(function(a,b){return(+ns[a].lessonNum||0)-(+ns[b].lessonNum||0);});
      for(j=0;j<nkeys.length;j++){
        nk=nkeys[j];n=ns[nk];hasAny=true;
        rows.push([csvEsc(s.name||''),n.lessonNum||'',csvEsc(n.date||''),csvEsc(n.content||'')].join(','));
      }
    }
    if(!hasAny){showToast('📭 저장된 수업 메모가 없습니다.');return;}
    var today=new Date().toLocaleDateString('ko-KR').replace(/\. /g,'-').replace('.','');
    downloadCSV('수업메모_'+today+'.csv',rows.join('\n'));
    showToast('📥 수업 메모 다운로드 완료!');
  });
}

/* ★ 특정 학생 수업메모 다운로드 */
function downloadStudentNotes(sid){
  var s=stuById(sid);if(!s)return;
  var refPath=G.stuData[sid]?'students':'quit_students';
  db.ref(refPath+'/'+sid+'/notes').once('value',function(snap){
    var notes=snap.val()||{};
    var keys=Object.keys(notes);
    if(!keys.length){showToast('📭 '+s.name+' 학생의 수업 메모가 없습니다.');return;}
    var rows=['회차,날짜,수업내용'];
    var ns=[];var i,k,n;
    for(i=0;i<keys.length;i++){k=keys[i];n=notes[k];n.id=n.id||k;ns.push(n);}
    ns.sort(function(a,b){return(+a.lessonNum||0)-(+b.lessonNum||0);});
    for(i=0;i<ns.length;i++){
      n=ns[i];
      rows.push([n.lessonNum||'',csvEsc(n.date||''),csvEsc(n.content||'')].join(','));
    }
    var today=new Date().toLocaleDateString('ko-KR').replace(/\. /g,'-').replace('.','');
    downloadCSV(s.name+'_수업메모_'+today+'.csv',rows.join('\n'));

  });
}

function vSchedule(){
  var ss=allStu(),ds=[],i,s,cnt,d,dc,on,h='',dayList;
  /* ★ 선택된 요일에 포함된 학생 모두 표시 (days 배열 지원) */
  for(i=0;i<ss.length;i++){
    dayList=ss[i].days?ss[i].days.split(','):[ss[i].day||'월'];
    if(dayList.indexOf(G.selDay)>=0)ds.push(ss[i]);
  }
  ds.sort(function(a,b){
    var la=LEVEL_ORDER[a.level||'기타']||3,lb=LEVEL_ORDER[b.level||'기타']||3;
    return la!==lb?la-lb:a.time.localeCompare(b.time);
  });
  h+='<div class="dtabs">';
  for(i=0;i<DAYS.length;i++){
    d=DAYS[i];cnt=0;
    for(var j=0;j<ss.length;j++){
      var dl=ss[j].days?ss[j].days.split(','):[ss[j].day||'월'];
      if(dl.indexOf(d)>=0)cnt++;
    }
    dc=DC[d];on=(G.selDay===d);
    h+='<button class="dtab" onclick="selDay(\''+d+'\')" style="border-color:'+(on?dc.bd:'#E5E7EB')+';background:'+(on?dc.bg:'#fff')+';color:'+(on?dc.tx:'#6B7280')+';font-weight:'+(on?800:500)+'">'+d+'<span style="font-size:8px;opacity:.8">'+cnt+'명</span></button>';
  }
  h+='</div>';
  if(!ds.length){
    h+='<div class="empty"><div style="font-size:30px;margin-bottom:7px">📭</div><div style="font-size:13px">등록된 수강생이 없습니다</div></div>';
    return h;
  }
  var LEVELS=['선수','상급','중급','기타'];
  var groups={},lv,ls,k;
  for(k=0;k<LEVELS.length;k++)groups[LEVELS[k]]=[];
  for(i=0;i<ds.length;i++){lv=ds[i].level||'기타';if(!groups[lv])groups[lv]=[];groups[lv].push(ds[i]);}
  h+='<div style="font-size:12px;color:#6B7280;margin-bottom:10px">'+G.selDay+'요일 전체 '+ds.length+'명</div>';
  for(k=0;k<LEVELS.length;k++){
    lv=LEVELS[k];ls=groups[lv];
    if(!ls||!ls.length)continue;
    var lvs=LEVEL_STYLE[lv]||LEVEL_STYLE['기타'];
    h+='<div style="background:'+lvs.bg+';border:2px solid '+lvs.bd+';border-radius:12px;padding:8px 12px;margin-bottom:8px">'
      +'<div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">'
      +'<span style="font-size:16px">'+lvs.icon+'</span>'
      +'<span style="font-weight:800;color:'+lvs.tx+';font-size:14px">'+lv+'</span>'
      +'<span style="background:'+lvs.bd+';color:#fff;border-radius:20px;padding:1px 8px;font-size:11px;font-weight:700">'+ls.length+'명</span>'
      +'</div>';
    for(i=0;i<ls.length;i++)h+=stuCardHtml(ls[i]);
    h+='</div>';
  }
  return h;
}

    +'<div style="font-size:12px;color:#6B7280;margin-bottom:3px">현재: '+s.usedLessons+'/'+s.totalLessons+'회</div>'
    +'<label class="lbl">추가할 수업 횟수</label>'
    +'<input class="fi" type="number" id="ADD_LESSON_CNT" value="10" min="1" max="200" style="font-size:18px;font-weight:700;text-align:center">'
    +'</div>'
    +'<div style="display:flex;gap:9px">'
    +'<button class="bs" onclick="closeAddLesson()" style="flex:1;padding:12px;border-radius:12px">취소</button>'
    +'<button class="bp" onclick="doAddLesson(\''+s.id+'\')" style="flex:2;border-radius:12px">✅ 추가하기</button>'
    +'</div>'
    +'</div></div>';
}

/* ══ 메인 렌더 ══ */
function R(){
  var app=document.getElementById('app'),sb=document.getElementById('SRCH_BOX');
  if(!G.user){if(sb)sb.style.display='none';app.innerHTML=vLogin();return;}
  if(sb)sb.style.display=(G.view==='srch'&&G.view!=='det')?'block':'none';
  var toast=G.notif?'<div class="toast"><span style="font-size:22px">🔔</span><div style="flex:1;font-size:13px">'+xe(G.notif)+'</div><button onclick="G.notif=null;R()" style="background:none;border:none;color:#fff;font-size:18px;cursor:pointer;opacity:.7">✕</button></div>':'';
  var body='';
  if(!G.admin)body+='<div class="ibanner"><span style="font-size:17px">✏️</span><div><div style="font-weight:700;color:#065F46;font-size:13px">강사 모드</div><div style="font-size:11px;color:#047857">수업 진행·메모 작성/수정/삭제 가능</div></div></div>';

  if(G.view==='det'&&G.sid){
    body+=vDetail();
  } else {
    body+=vTabs();
    if(G.view==='quit'){
      body+=vQuit();
    } else {
      body+=alertPanelHtml();
      /* ★ 원장님만 다운로드 패널 표시 */
      if(G.admin)body+=dlPanelHtml();
      if(G.view==='sch')body+=vSchedule();
      else if(G.view==='all')body+=vAll();
    }
  }

  app.innerHTML=toast+vHdr()+'<div class="main">'+body+'</div>'
    +(G.form&&G.admin?vForm():'')
    +(G.showAddLesson&&G.addLessonSid?vAddLessonModal():'');

  if(G.enid){var ta=document.getElementById('NOTE_TA');if(ta)ta.focus();}
}

auth.onAuthStateChanged(function(user){
  if(user){G.user=user;G.admin=(user.email===ADMIN_EMAIL);startListen();}
  else{
    G.user=null;G.admin=false;G.stuData={};G.quitData={};G.curNotes={};
    if(_noteListener){
      db.ref('students/'+_noteListener+'/notes').off();
      db.ref('quit_students/'+_noteListener+'/notes').off();
      _noteListener=null;
    }
    db.ref('students').off();
    db.ref('quit_students').off();
    R();
  }
});
</script>
</body>
