<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>수업 회차 수정 도구</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#F0F4FF;min-height:100vh;font-size:15px}
.wrap{max-width:500px;margin:0 auto;padding:16px}
.hdr{background:linear-gradient(135deg,#1E1B4B,#4338CA);color:#fff;padding:16px;border-radius:14px;margin-bottom:16px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.btn{border:none;border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer;width:100%}
.btn-p{background:linear-gradient(135deg,#6366F1,#8B5CF6);color:#fff}
.btn-g{background:linear-gradient(135deg,#059669,#10B981);color:#fff}
.btn-o{background:#FFF7ED;color:#F97316;border:2px solid #FED7AA}
.btn-r{background:#FEE2E2;color:#DC2626;border:none}
.btn-s{background:#F3F4F6;color:#374151;border:none}
.fi{width:100%;padding:10px 14px;border-radius:10px;border:2px solid #E5E7EB;font-size:14px;outline:none;margin-bottom:10px}
.fi:focus{border-color:#6366F1}
.lbl{font-size:12px;font-weight:700;color:#6B7280;margin-bottom:5px;display:block}
.note-row{padding:12px;background:#F9FAFB;border:1.5px solid #E5E7EB;border-radius:12px;margin-bottom:8px}
.mini-input{width:54px;padding:5px 6px;border-radius:7px;border:2px solid #6366F1;font-size:14px;font-weight:700;text-align:center;outline:none}
.mini-sel{padding:5px 6px;border-radius:7px;border:2px solid #F97316;font-size:13px;font-weight:700;outline:none;background:#FFF7ED;color:#F97316;cursor:pointer}
.step{background:#EEF2FF;border:2px solid #818CF8;border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:13px;color:#4338CA;line-height:1.6}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;z-index:100;display:none;max-width:380px;width:calc(100% - 32px);text-align:center}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:800}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div style="font-size:11px;color:#A5B4FC;margin-bottom:4px">관리자 전용 도구</div>
    <div style="font-size:18px;font-weight:800">🔧 수업 회차·기수 수정 도구</div>
    <div style="font-size:12px;color:#C7D2FE;margin-top:4px">기수(期)와 회차번호를 직접 수정합니다</div>
  </div>

  <!-- 로그인 -->
  <div id="LOGIN_CARD" class="card">
    <div class="step">① 학원을 선택하고 원장 계정으로 로그인하세요</div>
    <label class="lbl">학원 선택</label>
    <select class="fi" id="SEL_ACAD">
      <option value="1">생각키움연구소 (사우점)</option>
      <option value="2">생각키움장기학원</option>
    </select>
    <label class="lbl">비밀번호</label>
    <input class="fi" type="password" id="PW" placeholder="원장 비밀번호 입력">
    <button class="btn btn-p" onclick="doLogin()">로그인</button>
    <div id="LOGIN_ERR" style="color:#DC2626;font-size:13px;margin-top:8px;text-align:center"></div>
  </div>

  <!-- 학생 선택 -->
  <div id="STU_CARD" class="card" style="display:none">
    <div class="step">② 수정할 학생을 검색해서 선택하세요</div>
    <input class="fi" type="text" id="SEARCH" placeholder="🔍 학생 이름 검색" oninput="filterStudents()" style="margin-bottom:8px">
    <div id="STU_LIST"></div>
  </div>

  <!-- 회차 수정 -->
  <div id="FIX_CARD" class="card" style="display:none">
    <div id="FIX_HEADER" style="margin-bottom:12px"></div>

    <div class="step" id="FIX_GUIDE">
      ③ 기수(期)와 회차번호를 올바르게 수정하세요<br>
      <span style="font-size:11px;color:#6B7280">· 기수: 1기·2기·3기 선택<br>· 회차: 숫자 직접 입력<br>· 날짜순 자동정렬 후 저장 권장</span>
    </div>

    <!-- 버튼 영역 -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">
      <button class="btn btn-o" onclick="autoReorder()">📅 날짜순 자동정렬</button>
      <button class="btn btn-s" onclick="goBack()">← 학생 목록</button>
    </div>

    <!-- 범례 -->
    <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
      <span class="tag" style="background:#EEF2FF;color:#4338CA">1기</span>
      <span class="tag" style="background:#FFF7ED;color:#C2410C">2기</span>
      <span class="tag" style="background:#F0FDF4;color:#15803D">3기</span>
      <span style="font-size:11px;color:#9CA3AF;align-self:center">← 기수 색상 구분</span>
    </div>

    <div id="NOTE_LIST"></div>

    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn btn-s" style="flex:1" onclick="goBack()">← 취소</button>
      <button class="btn btn-g" style="flex:2" onclick="saveAll()">✅ 저장하기</button>
    </div>
  </div>
</div>

<div class="toast" id="TOAST"></div>

<script>
var FB_CONFIGS={
  '1':{apiKey:"AIzaSyDCNm3RzgKOsVsG864yopYaY9jnOycDVIc",authDomain:"project-402538a5-a8b1-40a1-a97.firebaseapp.com",databaseURL:"https://project-402538a5-a8b1-40a1-a97-default-rtdb.firebaseio.com",projectId:"project-402538a5-a8b1-40a1-a97",storageBucket:"project-402538a5-a8b1-40a1-a97.firebasestorage.app",messagingSenderId:"414728841659",appId:"1:414728841659:web:0d883c5ce39b0ab679fc9e"},
  '2':{apiKey:"AIzaSyDt5fhHNGm8FcayZBVofVfi96kih_f_Ipo",authDomain:"kiwoom-janggi.firebaseapp.com",databaseURL:"https://kiwoom-janggi-default-rtdb.firebaseio.com",projectId:"kiwoom-janggi",storageBucket:"kiwoom-janggi.firebasestorage.app",messagingSenderId:"202402846516",appId:"1:202402846516:web:0d883c5ce39b0ab679fc9e"}
};
var ADMIN_EMAIL="noella7154@gmail.com";
var fbApp=null,auth=null,db=null;
var G={students:[],curSid:null,curNotes:[]};

var TERM_STYLE={
  1:{bg:'#EEF2FF',tx:'#4338CA',bd:'#818CF8'},
  2:{bg:'#FFF7ED',tx:'#C2410C',bd:'#FB923C'},
  3:{bg:'#F0FDF4',tx:'#15803D',bd:'#4ADE80'},
  4:{bg:'#FDF4FF',tx:'#7E22CE',bd:'#C084FC'},
  5:{bg:'#FEF9C3',tx:'#854D0E',bd:'#FACC15'}
};

function termStyle(t){return TERM_STYLE[t]||{bg:'#F3F4F6',tx:'#374151',bd:'#9CA3AF'};}

/* ══ 로그인 ══ */
function doLogin(){
  var acad=document.getElementById('SEL_ACAD').value;
  var pw=document.getElementById('PW').value;
  var err=document.getElementById('LOGIN_ERR');
  if(!pw){err.textContent='비밀번호를 입력해주세요.';return;}
  if(fbApp){try{fbApp.delete();}catch(e){}}
  fbApp=firebase.initializeApp(FB_CONFIGS[acad],'fix_'+Date.now());
  auth=fbApp.auth();db=fbApp.database();
  err.textContent='로그인 중...';
  auth.signInWithEmailAndPassword(ADMIN_EMAIL,pw)
    .then(function(uc){
      if(uc.user.email!==ADMIN_EMAIL){err.textContent='원장 계정만 사용 가능';auth.signOut();return;}
      document.getElementById('LOGIN_CARD').style.display='none';
      loadStudents();
    })
    .catch(function(e){
      var m={'auth/wrong-password':'비밀번호가 틀렸습니다.','auth/invalid-credential':'비밀번호를 확인해주세요.','auth/too-many-requests':'잠시 후 다시 시도해주세요.'};
      err.textContent=m[e.code]||'로그인 실패';
    });
}

/* ══ 학생 목록 ══ */
function loadStudents(){
  db.ref('students').once('value',function(snap){
    var data=snap.val()||{};
    G.students=Object.keys(data).map(function(k){var s=data[k];s.id=k;return s;})
      .sort(function(a,b){return(a.name||'').localeCompare(b.name||'');});
    renderStudents(G.students);
    document.getElementById('STU_CARD').style.display='block';
  });
}

function filterStudents(){
  var q=document.getElementById('SEARCH').value.trim();
  renderStudents(q?G.students.filter(function(s){return(s.name||'').indexOf(q)>=0;}):G.students);
}

function renderStudents(list){
  var box=document.getElementById('STU_LIST'),h='';
  if(!list.length){box.innerHTML='<p style="text-align:center;color:#9CA3AF;padding:16px">검색 결과 없음</p>';return;}
  for(var i=0;i<list.length;i++){
    var s=list[i];
    var dc={월:'#4338CA',화:'#C2410C',수:'#15803D',목:'#7E22CE',금:'#BE123C',토:'#0369A1',일:'#854D0E'};
    var c=dc[s.day||'월']||'#6B7280';
    h+='<button data-sid="'+xe(s.id)+'" onclick="selectStudent(this.dataset.sid)" style="width:100%;background:#fff;border:1.5px solid #E5E7EB;border-radius:10px;padding:10px 14px;margin-bottom:7px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:10px">';
    h+='<div style="width:36px;height:36px;border-radius:8px;background:#EEF2FF;border:2px solid '+c+';display:flex;align-items:center;justify-content:center;flex-shrink:0"><span style="font-size:11px;font-weight:800;color:'+c+'">'+(s.day||'?')+'</span></div>';
    h+='<div style="flex:1;min-width:0"><div style="font-weight:700;font-size:14px;color:#111827">'+xe(s.name||'')+'</div>';
    h+='<div style="font-size:11px;color:#9CA3AF">'+(s.time||'')+' · '+(s.term||1)+'기 진행중 · '+( s.usedLessons||0)+'/'+(s.totalLessons||0)+'회</div></div>';
    h+='<span style="color:#9CA3AF;font-size:18px">›</span></button>';
  }
  box.innerHTML=h;
}

/* ══ 학생 선택 → 노트 로드 ══ */
function selectStudent(sid){
  G.curSid=sid;
  var s=G.students.find(function(x){return x.id===sid;});
  document.getElementById('STU_CARD').style.display='none';
  document.getElementById('FIX_CARD').style.display='block';
  var ts=termStyle(+((s&&s.term)||1));
  document.getElementById('FIX_HEADER').innerHTML=
    '<div style="display:flex;align-items:center;gap:10px;padding:12px 14px;background:'+ts.bg+';border:2px solid '+ts.bd+';border-radius:12px">'
    +'<div><div style="font-size:18px;font-weight:800;color:#111827">'+xe(s?s.name||'':'')+'</div>'
    +'<div style="font-size:12px;color:#6B7280">'+(s?s.day||'':'')+'요일 '+(s?s.time||'':'')
    +' · <b style="color:'+ts.tx+'">현재 '+(s&&s.term?s.term:'1')+'기</b> · 총 '+(s?s.totalLessons||0:0)+'회</div></div></div>';

  showToast('⏳ 수업 기록 로딩 중...');
  db.ref('students/'+sid+'/notes').once('value',function(snap){
    var data=snap.val()||{};
    G.curNotes=Object.keys(data).map(function(k){
      var n=data[k];n.key=k;n.id=n.id||k;
      n.term=+n.term||1;n.lessonNum=+n.lessonNum||0;
      return n;
    });
    G.curNotes.sort(function(a,b){return parseD(a)-parseD(b);});
    renderNotes();
    showToast('✅ '+G.curNotes.length+'개 수업 기록 로드 완료');
  });
}

function parseD(n){
  if(n.dateRaw)return new Date(n.dateRaw);
  var s=(n.date||'').replace(/[.]/g,'').trim();
  var parts=s.split(' ').filter(function(p){return p.trim().length>0;});
  if(parts.length>=3)return new Date(+parts[0],+parts[1]-1,+parts[2]);
  return new Date(0);
}

function renderNotes(){
  var box=document.getElementById('NOTE_LIST'),h='';
  if(!G.curNotes.length){
    box.innerHTML='<p style="text-align:center;color:#9CA3AF;padding:20px">수업 기록이 없습니다</p>';return;
  }
  /* 최대 기수 파악 */
  var maxTerm=1;
  for(var i=0;i<G.curNotes.length;i++)if(G.curNotes[i].term>maxTerm)maxTerm=G.curNotes[i].term;
  var termOpts='';
  for(var t=1;t<=Math.max(maxTerm+1,5);t++)termOpts+='<option value="'+t+'">'+t+'기</option>';

  for(var i=0;i<G.curNotes.length;i++){
    var n=G.curNotes[i];
    var ts=termStyle(n.term);
    h+='<div style="padding:12px;background:'+ts.bg+';border:2px solid '+ts.bd+';border-radius:12px;margin-bottom:8px">';
    /* 상단: 날짜 + 기수선택 + 회차입력 */
    h+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap">';
    h+='<span style="font-size:12px;font-weight:700;color:'+ts.tx+'">📅 '+xe(n.date||'날짜없음')+'</span>';
    h+='<div style="display:flex;align-items:center;gap:5px;margin-left:auto">';
    /* 기수 선택 */
    h+='<select class="mini-sel" id="TERM_'+n.key+'" style="border-color:'+ts.bd+';color:'+ts.tx+';background:'+ts.bg+'">';
    for(var t=1;t<=Math.max(maxTerm+1,5);t++){
      h+='<option value="'+t+'"'+(t===n.term?' selected':'')+'>'+t+'기</option>';
    }
    h+='</select>';
    /* 회차 입력 */
    h+='<input class="mini-input" type="number" min="1" max="99" value="'+n.lessonNum+'" id="NUM_'+n.key+'" style="border-color:'+ts.bd+'">';
    h+='<span style="font-size:11px;color:'+ts.tx+';font-weight:600">회차</span>';
    h+='</div></div>';
    /* 메모 내용 */
    if(n.content){
      h+='<div style="font-size:12px;color:#374151;line-height:1.5;white-space:pre-wrap">'+xe(n.content.slice(0,80))+(n.content.length>80?'...':'')+'</div>';
    } else {
      h+='<div style="font-size:12px;color:#9CA3AF">(메모 없음)</div>';
    }
    h+='</div>';
  }
  box.innerHTML=h;
}

/* ══ 날짜순 자동정렬 ══ */
function autoReorder(){
  if(!confirm('날짜순으로 회차를 자동 정렬하시겠습니까?\n기수는 현재 설정 유지, 각 기수별 1회부터 번호 부여'))return;

  /* 현재 선택된 기수값 반영 */
  for(var i=0;i<G.curNotes.length;i++){
    var n=G.curNotes[i];
    var tEl=document.getElementById('TERM_'+n.key);
    if(tEl)n.term=parseInt(tEl.value)||1;
  }

  /* 기수별 분류 → 날짜순 정렬 → 번호 부여 */
  var groups={};
  for(var i=0;i<G.curNotes.length;i++){
    var t=G.curNotes[i].term;
    if(!groups[t])groups[t]=[];
    groups[t].push(G.curNotes[i]);
  }
  var terms=Object.keys(groups).map(Number).sort(function(a,b){return a-b;});
  for(var ti=0;ti<terms.length;ti++){
    var arr=groups[terms[ti]];
    arr.sort(function(a,b){return parseD(a)-parseD(b);});
    for(var j=0;j<arr.length;j++){
      arr[j].lessonNum=j+1;
      var el=document.getElementById('NUM_'+arr[j].key);
      if(el)el.value=j+1;
    }
  }
  /* 화면 갱신 */
  renderNotes();
  showToast('📅 자동 정렬 완료! 내용 확인 후 저장하기를 누르세요.');
}

/* ══ 저장 ══ */
function saveAll(){
  if(!G.curSid){showToast('학생을 먼저 선택해주세요.');return;}
  if(!confirm('수정된 내용을 Firebase에 저장하시겠습니까?'))return;

  var upd={};
  var termMax=1;
  for(var i=0;i<G.curNotes.length;i++){
    var n=G.curNotes[i];
    var numEl=document.getElementById('NUM_'+n.key);
    var termEl=document.getElementById('TERM_'+n.key);
    var num=numEl?parseInt(numEl.value)||1:n.lessonNum||1;
    var term=termEl?parseInt(termEl.value)||1:n.term||1;
    upd['notes/'+n.key+'/lessonNum']=num;
    upd['notes/'+n.key+'/term']=term;
    if(term>termMax)termMax=term;
  }
  /* 학생의 term(현재 기수)도 최대값으로 업데이트 */
  upd['term']=termMax;

  db.ref('students/'+G.curSid).update(upd)
    .then(function(){
      showToast('✅ 저장 완료! 학원관리 앱에서 확인하세요.');
      /* 노트 다시 로드해서 화면 갱신 */
      db.ref('students/'+G.curSid+'/notes').once('value',function(snap){
        var data=snap.val()||{};
        G.curNotes=Object.keys(data).map(function(k){
          var n=data[k];n.key=k;n.id=n.id||k;
          n.term=+n.term||1;n.lessonNum=+n.lessonNum||0;return n;
        });
        G.curNotes.sort(function(a,b){return parseD(a)-parseD(b);});
        renderNotes();
      });
    })
    .catch(function(e){showToast('❌ 저장 실패: '+e.message);});
}

function goBack(){
  document.getElementById('FIX_CARD').style.display='none';
  document.getElementById('STU_CARD').style.display='block';
  G.curSid=null;G.curNotes=[];
  document.getElementById('SEARCH').value='';
  renderStudents(G.students);
}

function xe(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

var _tt;
function showToast(msg){
  var t=document.getElementById('TOAST');
  t.textContent=msg;t.style.display='block';
  clearTimeout(_tt);_tt=setTimeout(function(){t.style.display='none';},4000);
}

document.addEventListener('keydown',function(e){if(e.key==='Enter'&&document.activeElement.id==='PW')doLogin();});
</script>
</body>
</html>
