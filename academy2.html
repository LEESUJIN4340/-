<style>

body{font-family:'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;background:#F0F4FF;min-height:100vh;font-size:15px}

button,input,select,textarea{font-family:inherit}

.bs{background:#F3F4F6;color:#374151;border:none;border-radius:10px;padding:9px 16px;font-weight:600;font-size:14px;cursor:pointer}

.tabs{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap}

.modal-c{background:#fff;border-radius:22px 22px 0 0;width:100%;max-width:500px;padding:20px 16px 44px;max-height:90vh;overflow-y:auto}
.pbar{height:8px;background:#E5E7EB;border-radius:4px;overflow:hidden}
.pfill{height:100%;border-radius:4px;transition:width .5s ease}
.ring-wrap{display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0}
.toast{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;border-radius:14px;padding:12px 18px;display:flex;gap:9px;align-items:center;max-width:400px;width:calc(100% - 20px);z-index:300;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:toastIn .3s ease}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.lbl{display:block;font-size:12px;font-weight:600;color:#6B7280;margin-bottom:5px}
.empty{text-align:center;color:#9CA3AF;padding:44px 0;background:#fff;border-radius:14px;border:2px dashed #E5E7EB}
.login-bg{min-height:100vh;background:linear-gradient(135deg,#0F0A2E,#1E1B4B,#4338CA,#6D28D9);display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:#fff;border-radius:22px;padding:32px 24px;width:100%;max-width:380px;box-shadow:0 24px 64px rgba(0,0,0,.35)}
.back-btn{display:inline-flex;align-items:center;gap:5px;background:none;border:none;color:#6366F1;font-weight:700;cursor:pointer;font-size:14px;padding:0;margin-bottom:14px}
.nta{width:100%;min-height:72px;border-radius:10px;border:2px solid #6366F1;padding:9px 12px;font-size:13px;resize:vertical;outline:none;line-height:1.5}
.ibanner{background:linear-gradient(135deg,#ECFDF5,#D1FAE5);border:2px solid #34D399;border-radius:12px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.hstat{flex:1;background:rgba(255,255,255,.13);border-radius:10px;padding:7px;text-align:center}
.errmsg{background:#FEF2F2;color:#DC2626;border-radius:9px;padding:10px 13px;font-size:13px;margin-top:8px;border:1px solid #FECACA}
.sec-ttl{font-size:14px;font-weight:700;color:#374151;margin-bottom:9px}
.dl-btn{background:linear-gradient(135deg,#059669,#10B981);color:#fff;border:none;border-radius:10px;padding:9px 14px;font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:5px;justify-content:center;width:100%;margin-bottom:8px}
.dl-panel{background:#fff;border-radius:14px;border:2px solid #D1FAE5;margin-bottom:12px;overflow:hidden}
.dl-panel-hd{padding:11px 14px;background:linear-gradient(135deg,#ECFDF5,#D1FAE5);border-bottom:1px solid #D1FAE5;display:flex;align-items:center;gap:7px}
.quit-card{background:#FFFBEB;border-radius:14px;padding:13px;border:1.5px solid #FCD34D;display:flex;align-items:center;gap:11px;margin-bottom:8px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.restore-btn{background:#EEF2FF;color:#4338CA;border:none;border-radius:8px;padding:5px 12px;font-weight:700;font-size:13px;cursor:pointer}
.lesson-modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:250;backdrop-filter:blur(4px);padding:20px}
.lesson-modal-c{background:#fff;border-radius:22px;width:100%;max-width:400px;padding:24px 20px}
.assign-stu{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:2px solid #E5E7EB;margin-bottom:7px;cursor:pointer;transition:all .15s;background:#F9FAFB}
.assign-stu.on{background:#EEF2FF;border-color:#818CF8}
</style>

<script>
var FBCFG={apiKey:"AIzaSyDt5fhHNGm8FcayZBVofVfi96kih_f_Ipo",authDomain:"kiwoom-janggi.firebaseapp.com",databaseURL:"https://kiwoom-janggi-default-rtdb.firebaseio.com",projectId:"kiwoom-janggi",storageBucket:"kiwoom-janggi.firebasestorage.app",messagingSenderId:"202402846516",appId:"1:202402846516:web:0d883c5ce39b0ab679fc9e"};
var ADMIN_EMAIL="noella7154@gmail.com";
var ACAD_NAME="생각키움장기학원";

var DAYS=['월','화','수','목','금','토','일'];
var DC={월:{bg:'#EEF2FF',tx:'#4338CA',bd:'#818CF8'},화:{bg:'#FFF7ED',tx:'#C2410C',bd:'#FB923C'},수:{bg:'#F0FDF4',tx:'#15803D',bd:'#4ADE80'},목:{bg:'#FDF4FF',tx:'#7E22CE',bd:'#C084FC'},금:{bg:'#FFF1F2',tx:'#BE123C',bd:'#FB7185'},토:{bg:'#F0F9FF',tx:'#0369A1',bd:'#38BDF8'},일:{bg:'#FEF9C3',tx:'#854D0E',bd:'#FACC15'}};
var TIMES=['09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00','20:00','21:00'];
var LO={선수:0,상급:1,중급:2,기타:3};
var LS={선수:{bg:'#FFF1F2',tx:'#BE123C',bd:'#FB7185',icon:'🥇'},상급:{bg:'#FFF7ED',tx:'#C2410C',bd:'#FB923C',icon:'🥈'},중급:{bg:'#ECFDF5',tx:'#065F46',bd:'#34D399',icon:'🥉'},기타:{bg:'#F3F4F6',tx:'#374151',bd:'#9CA3AF',icon:'📚'}};

var G={
  user:null,admin:false,
  stuData:{},quitData:{},curNotes:{},
  assignData:{},teachers:[],
  view:'sch',prevView:'sch',selDay:'월',sid:null,
  notif:null,form:false,esid:null,fdays:['월'],enid:null,
  showAddLesson:false,addLessonSid:null,
  assignTeacher:null
};
var _saving=false,_ime=false,_pend=false,_noteListener=null,_addingLesson=false;

/* 초성 */
var CSARR='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
function toCS(s){var r='',i,c;for(i=0;i<s.length;i++){c=s.charCodeAt(i);r+=(c>=0xAC00&&c<=0xD7A3)?CSARR[Math.floor((c-0xAC00)/588)]:s[i];}return r;}
function isCS(s){var i,c;if(!s)return false;for(i=0;i<s.length;i++){c=s.charCodeAt(i);if(!(c>=0x3131&&c<=0x314E))return false;}return s.length>0;}

/* 유틸 */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2);}
function xe(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function rem(s){return Math.max(0,(+s.totalLessons||0)-(+s.usedLessons||0));}
function rc(r){return r<=0?'#EF4444':r===1?'#F97316':r<=3?'#F59E0B':'#10B981';}
function eKey(email){return email.replace(/\./g,'_DOT_').replace(/@/g,'_AT_');}

function objArr(obj){
  var r=[],keys,i,k,s,copy,p;if(!obj)return r;keys=Object.keys(obj);
  for(i=0;i<keys.length;i++){k=keys[i];s=obj[k];copy={};for(p in s){if(Object.prototype.hasOwnProperty.call(s,p))copy[p]=s[p];}copy.id=copy.id||k;copy.totalLessons=+copy.totalLessons||0;copy.usedLessons=+copy.usedLessons||0;r.push(copy);}
  return r;
}
function noteArr(obj){
  var r=[],keys,i,k,n,copy,p;if(!obj)return r;keys=Object.keys(obj);
  for(i=0;i<keys.length;i++){k=keys[i];n=obj[k];copy={};for(p in n){if(Object.prototype.hasOwnProperty.call(n,p))copy[p]=n[p];}copy.id=copy.id||k;r.push(copy);}
  return r.sort(function(a,b){
    var ta=+a.term||1,tb=+b.term||1;
    if(ta!==tb)return ta-tb;
    /* 날짜 파싱 함수 */
    function parseDate(n){
      /* dateRaw: yyyy-mm-dd 형식 우선 */
      if(n.dateRaw)return new Date(n.dateRaw);
      var s=n.date||'';
      var m=s.replace(/[.]/g,'').trim().split(' ');
      if(m.length>=3)return new Date(+m[0],+m[1]-1,+m[2]);
      return new Date(0);
    }
    var diff=parseDate(a)-parseDate(b);
    if(diff!==0)return diff;
    return (+a.lessonNum||0)-(+b.lessonNum||0);
  });
}
function allStu(){
  var all=objArr(G.stuData);
  if(G.admin)return all;
  if(!G.user)return [];
  var key=eKey(G.user.email);
  var assigned=G.assignData[key]||{};
  if(!Object.keys(assigned).length)return [];
  return all.filter(function(s){return assigned[s.id]===true;});
}
function allQuit(){return objArr(G.quitData);}
function stuById(id){
  var s=G.stuData[id]||G.quitData[id];if(!s)return null;
  var c={},p;for(p in s){if(Object.prototype.hasOwnProperty.call(s,p))c[p]=s[p];}
  c.id=c.id||id;c.totalLessons=+c.totalLessons||0;c.usedLessons=+c.usedLessons||0;return c;
}

firebase.initializeApp(FBCFG);
var auth=firebase.auth(),db=firebase.database();

document.addEventListener('compositionstart',function(){_ime=true;});
document.addEventListener('compositionend',function(){_ime=false;if(_pend){_pend=false;R();}});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.id==='SRCH_INPUT'){e.preventDefault();doSearch();}
  if(e.key==='Enter'&&e.target.id==='PW_IN')doLogin();
  if(e.key==='Enter'&&e.target.id==='NEW_TEACHER_EMAIL')addTeacher();
});

function startListen(){
  db.ref('students').on('value',function(snap){
    var data=snap.val()||{},keys,i,k,s,basic,p;
    G.stuData={};keys=Object.keys(data);
    for(i=0;i<keys.length;i++){
      k=keys[i];s=data[k];basic={};
      for(p in s){if(Object.prototype.hasOwnProperty.call(s,p)&&p!=='notes')basic[p]=s[p];}
      basic.id=basic.id||k;basic.totalLessons=+basic.totalLessons||0;basic.usedLessons=+basic.usedLessons||0;
      if(G.admin&&rem(basic)<=0&&!basic.notified){showToast(basic.name+' 학생 수업 완료!');db.ref('students/'+k+'/notified').set(true);}
      G.stuData[k]=basic;
    }
    /* ★ 상세 화면 보는 중이면 노트 리스너 재확인 */
    if(G.view==='det'&&G.sid&&!_noteListener){
      loadNotes(G.sid);
    }
    safeR();
  });
  db.ref('quit_students').on('value',function(snap){
    var data=snap.val()||{},keys,i,k,s,basic,p;
    G.quitData={};keys=Object.keys(data);
    for(i=0;i<keys.length;i++){k=keys[i];s=data[k];basic={};for(p in s){if(Object.prototype.hasOwnProperty.call(s,p)&&p!=='notes')basic[p]=s[p];}basic.id=basic.id||k;basic.totalLessons=+basic.totalLessons||0;basic.usedLessons=+basic.usedLessons||0;G.quitData[k]=basic;}
    safeR();
  });
  db.ref('assign').on('value',function(snap){
    G.assignData=snap.val()||{};
    safeR();
  });
  db.ref('teachers').on('value',function(snap){
    var data=snap.val()||{},keys,i;
    G.teachers=[];keys=Object.keys(data);
    for(i=0;i<keys.length;i++){if(data[keys[i]]&&data[keys[i]].email)G.teachers.push(data[keys[i]].email);}
    safeR();
  });
}
function loadNotes(sid){
  if(_noteListener){
    db.ref('students/'+_noteListener+'/notes').off();
    db.ref('quit_students/'+_noteListener+'/notes').off();
    _noteListener=null;
  }
  G.curNotes={};if(!sid)return;
  _noteListener=sid;
  var rp=G.stuData[sid]?'students':'quit_students';
  db.ref(rp+'/'+sid+'/notes').on('value',function(snap){
    G.curNotes=snap.val()||{};
    if(G.view==='det'&&G.sid===sid)R();
  });
}
function safeR(){var si=document.getElementById('SRCH_INPUT');if(_ime||(si&&document.activeElement===si)){_pend=true;return;}R();}

function saveStu(){
  if(_saving)return;
  var ne=document.getElementById('F_NAME');
  if(!ne||!ne.value.trim()){alert('이름을 입력해 주세요.');return;}
  _saving=true;
  var id=G.esid||uid(),ex=G.stuData[id]||{},obj={},p;
  for(p in ex){if(Object.prototype.hasOwnProperty.call(ex,p))obj[p]=ex[p];}
  obj.id=id;obj.name=ne.value.trim();
  obj.contact=(document.getElementById('F_CONTACT')||{}).value||'';
  obj.birthdate=(document.getElementById('F_BIRTH')||{}).value||'';
  var sd=G.fdays.length?G.fdays:['월'];obj.days=sd.join(',');obj.day=sd[0];
  obj.time=(document.getElementById('F_TIME')||{}).value||'15:00';
  obj.totalLessons=parseInt((document.getElementById('F_TOTAL')||{}).value)||10;
  obj.usedLessons=parseInt((document.getElementById('F_USED')||{}).value)||0;
  obj.level=(document.getElementById('F_LEVEL')||{}).value||'기타';
  obj.lichessId=(document.getElementById('F_LICHESS_ID')||{}).value||'';
  obj.lichessPw=(document.getElementById('F_LICHESS_PW')||{}).value||'';
  obj.notified=ex.notified||false;obj.createdAt=ex.createdAt||new Date().toISOString();
  db.ref('students/'+id).update(obj)
    .then(function(){_saving=false;G.form=false;G.esid=null;showToast('저장되었습니다.');})
    .catch(function(e){_saving=false;alert('저장 오류: '+e.message);});
}
function delStu(id){
  if(!confirm('정말 삭제하시겠습니까?'))return;
  if(_noteListener===id){db.ref('students/'+id+'/notes').off();_noteListener=null;}
  db.ref('students/'+id).remove();G.sid=null;G.view=G.prevView||'sch';R();
}
function moveToQuit(id){
  if(!confirm('퇴원 처리하시겠습니까? 수업 기록은 보존됩니다.'))return;
  db.ref('students/'+id).once('value',function(snap){
    var data=snap.val();if(!data)return;
    data.quitDate=new Date().toISOString();
    db.ref('quit_students/'+id).set(data).then(function(){
      db.ref('students/'+id).remove();
      if(_noteListener===id){db.ref('students/'+id+'/notes').off();_noteListener=null;}
      G.sid=null;G.view='quit';G.curNotes={};showToast('퇴원 처리되었습니다.');
    });
  });
}
function restoreStudent(id){
  if(!confirm('재학생으로 복귀시키겠습니까?'))return;
  db.ref('quit_students/'+id).once('value',function(snap){
    var data=snap.val();if(!data)return;
    delete data.quitDate;data.notified=false;
    db.ref('students/'+id).set(data).then(function(){
      db.ref('quit_students/'+id).remove();
      if(_noteListener===id){db.ref('quit_students/'+id+'/notes').off();_noteListener=null;}
      showToast('재학생으로 복귀되었습니다.');
    });
  });
}
function delQuitStu(id){
  if(!confirm('완전히 삭제하시겠습니까?'))return;
  if(_noteListener===id){db.ref('quit_students/'+id+'/notes').off();_noteListener=null;}
  db.ref('quit_students/'+id).remove();G.sid=null;G.view='quit';G.curNotes={};R();
}
function switchAddTab(tab){
  var panels={cur:'PANEL_CUR',new:'PANEL_NEW',del:'PANEL_DEL'};
  var btns={cur:'TAB_CUR',new:'TAB_NEW',del:'TAB_DEL'};
  var colors={cur:'#6366F1',new:'#4338CA',del:'#DC2626'};
  Object.keys(panels).forEach(function(k){
    var p=document.getElementById(panels[k]);
    var b=document.getElementById(btns[k]);
    if(p)p.style.display=(k===tab?'block':'none');
    if(b){
      b.style.background=(k===tab?colors[k]:'#F3F4F6');
      b.style.color=(k===tab?'#fff':'#6B7280');
    }
  });
}

function openAddLesson(sid){G.showAddLesson=true;G.addLessonSid=sid;R();}
function closeAddLesson(){G.showAddLesson=false;G.addLessonSid=null;R();}
function addLesson(sid){
  if(_addingLesson){showToast('⏳ 저장 중입니다. 잠시 후 다시 눌러주세요.');return;}
  var s=stuById(sid);if(!s)return;
  if(rem(s)<=0){openAddLesson(sid);return;}
  _addingLesson=true;
  db.ref('students/'+sid).once('value',function(stuSnap){
    var stuData=stuSnap.val();
    if(!stuData){_addingLesson=false;return;}
    var term=+stuData.term||1;
    var totalLessons=+stuData.totalLessons||0;
    var usedLessons=+stuData.usedLessons||0;
    var r2=Math.max(0,totalLessons-usedLessons);
    if(r2<=0){_addingLesson=false;openAddLesson(sid);return;}
    var globalUsed=Math.min(usedLessons+1,totalLessons);
    var r3=Math.max(0,totalLessons-globalUsed);
    var notes=stuData.notes||{};
    var nkeys=Object.keys(notes),i,maxNum=0;
    for(i=0;i<nkeys.length;i++){
      var n=notes[nkeys[i]];
      var nTerm=n.term&&+n.term>0?+n.term:1;
      if(nTerm===term&&(+n.lessonNum||0)>maxNum)maxNum=+n.lessonNum||0;
    }
    var nu=maxNum+1;
    var nid=uid(),upd={usedLessons:globalUsed};
    upd['notes/'+nid]={id:nid,date:new Date().toLocaleDateString('ko-KR'),content:'',lessonNum:nu,term:term};
    db.ref('students/'+sid).update(upd).then(function(){
      _addingLesson=false;
      if(r3===1)showToast('⚠️ '+s.name+' 학생 수업이 1회 남았습니다!');
      if(r3===0)showToast(s.name+' 모든 수업 완료!');
    }).catch(function(e){_addingLesson=false;showToast('❌ 저장 실패: '+e.message);});
  }).catch(function(e){_addingLesson=false;showToast('❌ 오류: '+e.message);});
}

function reorderLessons(sid){
  if(!confirm('모든 수업 기록을 날짜순으로 회차를 자동 정렬하시겠습니까?'))return;
  var rp=G.stuData[sid]?'students':'quit_students';
  db.ref(rp+'/'+sid+'/notes').once('value',function(snap){
    var notes=snap.val()||{},keys=Object.keys(notes),i;
    if(!keys.length){showToast('수업 기록이 없습니다.');return;}
    var groups={};
    for(i=0;i<keys.length;i++){
      var n=notes[keys[i]];n.key=keys[i];
      var t=+(n.term&&+n.term>0?n.term:1);
      if(!groups[t])groups[t]=[];groups[t].push(n);
    }
    var upd={};
    var terms=Object.keys(groups).map(Number).sort(function(a,b){return a-b;});
    for(var ti=0;ti<terms.length;ti++){
      var arr=groups[terms[ti]];
      arr.sort(function(a,b){return parseD(a)-parseD(b);});
      for(var j=0;j<arr.length;j++)upd['notes/'+arr[j].key+'/lessonNum']=j+1;
    }
    db.ref(rp+'/'+sid).update(upd).then(function(){
      showToast('✅ 회차가 날짜순으로 정렬되었습니다!');
      if(_noteListener===sid){db.ref(rp+'/'+sid+'/notes').off();_noteListener=null;}
      loadNotes(sid);
    }).catch(function(e){showToast('❌ 오류: '+e.message);});
  });
}
function delNote(sid,nid){
  if(!confirm('수업 기록을 삭제하시겠습니까?'))return;
  var s=stuById(sid);
  var rp=G.stuData[sid]?'students':'quit_students';
  db.ref(rp+'/'+sid+'/notes/'+nid).once('value',function(snap){
    var delN=snap.val();var delTerm=delN?(+(delN.term&&+delN.term>0?delN.term:1)):1;
    db.ref(rp+'/'+sid+'/notes/'+nid).remove().then(function(){
      db.ref(rp+'/'+sid+'/usedLessons').set(Math.max(0,(+s.usedLessons||1)-1));
      db.ref(rp+'/'+sid+'/notes').once('value',function(snap2){
        var notes=snap2.val()||{},keys=Object.keys(notes),i;
        var termNotes=[];
        for(i=0;i<keys.length;i++){
          var n=notes[keys[i]];
          var nt=+(n.term&&+n.term>0?n.term:1);
          if(nt===delTerm)termNotes.push({key:keys[i],node:n});
        }
        termNotes.sort(function(a,b){return parseD(a.node)-parseD(b.node);});
        var upd={};
        for(i=0;i<termNotes.length;i++)upd['notes/'+termNotes[i].key+'/lessonNum']=i+1;
        if(Object.keys(upd).length>0)db.ref(rp+'/'+sid).update(upd);
      });
    });
  });
}

/* 다운로드 */
function csvEsc(v){var s=String(v||'');if(s.indexOf(',')>=0||s.indexOf('"')>=0||s.indexOf('\n')>=0)return'"'+s.replace(/"/g,'""')+'"';return s;}
function downloadCSV(fn,csv){
  var blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  var url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=fn;document.body.appendChild(a);a.click();
  setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},100);
}
function downloadStudentInfo(){
  var ss=allStu();if(!ss.length){alert('다운로드할 학생 정보가 없습니다.');return;}
  ss.sort(function(a,b){return a.day.localeCompare(b.day)||a.time.localeCompare(b.time);});
  var rows=['이름,생년월일,연락처,수업요일,수업시간,총수업횟수,진행횟수,남은횟수'],i,s;
  for(i=0;i<ss.length;i++){s=ss[i];rows.push([csvEsc(s.name),csvEsc(s.birthdate),csvEsc(s.contact),csvEsc(s.day),csvEsc(s.time),s.totalLessons,s.usedLessons,rem(s)].join(','));}
  downloadCSV('학생정보.csv',rows.join('\n'));showToast('학생 정보 다운로드 완료!');
}
function downloadAllNotes(){
  showToast('수업 메모를 불러오는 중...');
  db.ref('students').once('value',function(snap){
    var data=snap.val()||{},rows=['학생이름,기수,회차,날짜,수업내용'],keys,i,k,s,ns,nkeys,j,nk,n,hasAny=false;
    keys=Object.keys(data);
    for(i=0;i<keys.length;i++){
      k=keys[i];s=data[k];if(!s||!s.notes)continue;ns=s.notes;nkeys=Object.keys(ns);
      nkeys.sort(function(a,b){return(+ns[a].lessonNum||0)-(+ns[b].lessonNum||0);});
      for(j=0;j<nkeys.length;j++){nk=nkeys[j];n=ns[nk];hasAny=true;rows.push([csvEsc(s.name||''),n.term||1,n.lessonNum||'',csvEsc(n.date||''),csvEsc(n.content||'')].join(','));}
    }
    if(!hasAny){showToast('저장된 수업 메모가 없습니다.');return;}
    downloadCSV('수업메모.csv',rows.join('\n'));showToast('수업 메모 다운로드 완료!');
  });
}
function downloadStudentNotes(sid){
  var s=stuById(sid);if(!s)return;
  var rp=G.stuData[sid]?'students':'quit_students';
  db.ref(rp+'/'+sid+'/notes').once('value',function(snap){
    var notes=snap.val()||{},keys=Object.keys(notes);
    if(!keys.length){showToast('수업 메모가 없습니다.');return;}
    var rows=['기수,회차,날짜,수업내용'],ns=[],i,k,n;
    for(i=0;i<keys.length;i++){k=keys[i];n=notes[k];n.id=n.id||k;ns.push(n);}
    ns.sort(function(a,b){var ta=+a.term||1,tb=+b.term||1;return ta!==tb?ta-tb:(+a.lessonNum||0)-(+b.lessonNum||0);});
    for(i=0;i<ns.length;i++){n=ns[i];rows.push([n.term||1,n.lessonNum||'',csvEsc(n.date||''),csvEsc(n.content||'')].join(','));}
    downloadCSV(s.name+'_수업메모.csv',rows.join('\n'));showToast(s.name+' 메모 다운로드 완료!');
  });
}

/* ══ 원장 로그인 시 전체 학생 회차 자동 수정 ══ */
function autoFixAllLessons(){
  db.ref('students').once('value',function(snap){
    var data=snap.val()||{};
    var skeys=Object.keys(data);
    var fixedCount=0;

    skeys.forEach(function(sid){
      var stu=data[sid];
      var notes=stu.notes;
      if(!notes)return;
      var nkeys=Object.keys(notes);
      if(!nkeys.length)return;

      /* ★ term이 있는 노트만 처리 - term은 절대 변경하지 않음 */
      var arr=nkeys.map(function(k){
        var n=notes[k];n.key=k;
        n.lessonNum=+n.lessonNum||0;
        n.hasTerm=(n.term&&+n.term>0);
        n.termVal=n.hasTerm?+n.term:null;
        return n;
      }).filter(function(n){return n.hasTerm;});

      if(!arr.length)return;

      /* 날짜순 정렬 후 기수별 분류 */
      arr.sort(function(a,b){return parseD(a)-parseD(b);});
      var groups={};
      arr.forEach(function(n){
        var t=n.termVal;
        if(!groups[t])groups[t]=[];
        groups[t].push(n);
      });

      var upd={};
      var needFix=false;
      var stuTerm=+stu.term||1;
      var actualUsed=0;
      var terms=Object.keys(groups).map(Number).sort(function(a,b){return a-b;});

      terms.forEach(function(term){
        var termArr=groups[term];
        termArr.sort(function(a,b){return parseD(a)-parseD(b);});
        termArr.forEach(function(n,j){
          /* ★ lessonNum만 수정, term 절대 변경 안함 */
          if(n.lessonNum!==j+1){
            upd['notes/'+n.key+'/lessonNum']=j+1;
            needFix=true;
          }
        });
        if(term===stuTerm)actualUsed=termArr.length;
      });

      /* usedLessons 보정 */
      if(actualUsed>0&&(+stu.usedLessons||0)!==actualUsed){
        upd.usedLessons=actualUsed;
        needFix=true;
      }

      if(needFix){
        fixedCount++;
        db.ref('students/'+sid).update(upd);
      }
    });

    setTimeout(function(){
      if(G.view==='det'&&G.sid){
        if(_noteListener){
          var rp2=G.stuData[_noteListener]?'students':'quit_students';
          db.ref(rp2+'/'+_noteListener+'/notes').off();
          _noteListener=null;
        }
        loadNotes(G.sid);
      }
      if(fixedCount>0)showToast('🔧 '+fixedCount+'명의 수업 회차가 자동 수정되었습니다.');
    },2000);
  });
}


auth.onAuthStateChanged(function(user){
  if(user){
    G.user=user;G.admin=(user.email===ADMIN_EMAIL);
    startListen();
    if(G.admin){setTimeout(autoFixAllLessons,3000);}
  } else {
    G.user=null;G.admin=false;G.stuData={};G.quitData={};G.curNotes={};
    G.assignData={};G.teachers=[];G.assignTeacher=null;
    if(_noteListener){
      db.ref('students/'+_noteListener+'/notes').off();
      db.ref('quit_students/'+_noteListener+'/notes').off();
      _noteListener=null;
    }
    db.ref('students').off();db.ref('quit_students').off();
    db.ref('assign').off();db.ref('teachers').off();
    R();
  }
});
